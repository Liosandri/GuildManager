<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster · Guilde</title>
<link rel="icon" type="image/png" href="assets/favicon.png?v=2">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#050a14">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="nav"></header>
<main class="wrap" id="app"></main>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script>

const app = document.getElementById('app');
const E = G.esc;
G.nav('roster.html');
let pub = null, externals = [], q = '', role = 'all', view = 'members';

app.innerHTML = '<div class="pagehead"><div><h1>👥 Roster</h1><p class="muted small" id="sub">Chargement…</p></div>' +
  '<div class="row"><button class="btn on" id="add">＋ Nouveau membre</button></div></div>' +
  '<div id="tabs"></div><input id="q" placeholder="Rechercher (nom, classe, spé)…" autocomplete="off">' +
  '<div class="chips" id="chips" style="margin:10px 0"></div><div id="list"></div>';
document.getElementById('q').oninput = ev => { q = ev.target.value; paint(); };
document.getElementById('add').onclick = () => (view === 'ext' ? extForm(null) : needOfficer().then(() => memberForm(null)));
const needOfficer = () => G.ensureOfficer('Entre le code d\'accès pour modifier le roster.').then(() => { G.nav('roster.html'); tabs(); paint(); });

function tabs() {
  if (!G.isOfficer()) { document.getElementById('tabs').innerHTML = ''; return; }
  document.getElementById('tabs').innerHTML = '<div class="seg"><button class="btn' + (view === 'members' ? ' on' : '') + '" data-v="members">Membres</button><button class="btn' + (view === 'ext' ? ' on' : '') + '" data-v="ext">Externes mémorisés</button></div>';
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = async () => {
    view = b.dataset.v; tabs(); chips();
    if (view === 'ext') { try { externals = (await G.post('externals')).externals; } catch (e) { G.toast(G.errMsg(e), true); } }
    paint();
  });
}
function chips() {
  const el = document.getElementById('chips');
  if (view === 'ext') { el.innerHTML = ''; document.getElementById('add').textContent = '＋ Nouvel externe'; return; }
  document.getElementById('add').textContent = '＋ Nouveau membre';
  const all = pub ? pub.members : [], m = all.filter(x => x.type !== 'reroll'), n = r => m.filter(x => x.role === r).length;
  const f = [['all', 'Tous ' + m.length], ['tank', '🛡️ ' + n('tank')], ['soigneur', '💚 ' + n('soigneur')], ['dps', '⚔️ ' + n('dps')], ['sub', '🔄 Remplaçants / essai'], ['reroll', '🔁 Rerolls ' + (all.length - m.length)]];
  el.innerHTML = f.map(c => '<button class="chip' + (role === c[0] ? ' on' : '') + '" data-r="' + c[0] + '">' + c[1] + '</button>').join('');
  el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { role = b.dataset.r; chips(); paint(); });
}

const kidsOf = key => (pub ? pub.members : []).filter(x => x.type === 'reroll' && x.main === key);
function card(m) {
  const os = m.spe2 ? 'OS : ' + m.spe2 + (m.role2 ? ' ' + G.ROLE[m.role2].emoji : '') : '';
  const st = G.statutNorm(m), kids = kidsOf(m.key), c = G.classColor(m.classe);
  const meta = [m.pseudo && m.pseudo !== m.key ? '💬 ' + E(m.pseudo) : '', os ? E(os) : ''].filter(Boolean).join(' · ');
  const chips = (st !== 'titulaire' ? '<span class="tag">' + (st === 'essai' ? '🆕 Essai' : '🔄 Remplaçant') + '</span>' : '') +
    (m.type === 'reroll' ? '<span class="tag link">🔁 reroll de <b>' + E(m.main) + '</b></span>' : '') +
    (kids.length ? '<span class="tag link soft">🔁 ' + (kids.length > 1 ? 'Rerolls' : 'Reroll') + ' : ' + E(kids.map(k => k.key).join(', ')) + '</span>' : '');
  return '<div class="mcard" style="--c:' + c + '"><div class="mc-head"><b class="mc-name">' + E(m.key) + '</b>' +
    (G.isOfficer() ? '<button class="btn small" data-edit="' + E(m.key) + '" aria-label="Modifier">✎</button>' : '') + '</div>' +
    '<div class="mc-spec" style="color:' + c + '">' + E([m.classe, m.spe].filter(Boolean).join(' · ')) + ' ' + (G.ROLE[m.role] ? G.ROLE[m.role].emoji : '') + '</div>' +
    (meta ? '<div class="mc-meta">' + meta + '</div>' : '') +
    (chips ? '<div class="mc-chips">' + chips + '</div>' : '') + '</div>';
}

function paint() {
  const list = document.getElementById('list');
  if (view === 'ext') return paintExt(list);
  if (!pub) return;
  const nq = G.norm(q), all = pub.members, m = all.filter(x => x.type !== 'reroll'), rrs = all.filter(x => x.type === 'reroll');
  const t = m.filter(x => G.statutNorm(x) === 'titulaire');
  document.getElementById('sub').textContent = m.length + ' membre' + (m.length > 1 ? 's' : '') + (rrs.length ? ' + ' + rrs.length + ' reroll' + (rrs.length > 1 ? 's' : '') : '') + ' · titulaires : 🛡️ ' + t.filter(x => x.role === 'tank').length + ' · 💚 ' + t.filter(x => x.role === 'soigneur').length + ' · ⚔️ ' + t.filter(x => x.role === 'dps').length;
  const ok = x => !nq || G.norm(x.key + ' ' + x.pseudo + ' ' + x.classe + ' ' + x.spe + ' ' + x.spe2 + ' ' + (x.main || '')).indexOf(nq) !== -1;
  const byName = (a, b) => a.key.localeCompare(b.key);
  const secs = [];
  ['tank', 'soigneur', 'dps'].forEach(r => {
    if (role === 'reroll' || (role !== 'all' && role !== r)) return;
    secs.push([G.ROLE[r].emoji + ' ' + G.ROLE[r].name, t.filter(x => x.role === r && ok(x)).sort(byName)]);
  });
  if (role === 'all') secs.push(['❓ Rôle à préciser', t.filter(x => !G.ROLE[x.role] && ok(x)).sort(byName)]);
  if (role === 'all' || role === 'sub') {
    secs.push(['🔄 Remplaçants', m.filter(x => G.statutNorm(x) === 'remplacant' && ok(x)).sort(byName)]);
    secs.push(['🆕 Essai', m.filter(x => G.statutNorm(x) === 'essai' && ok(x)).sort(byName)]);
  }
  if (role === 'all' || role === 'reroll') secs.push(['🔁 Rerolls (visibles seulement ici)', rrs.filter(ok).sort((a, b) => (a.main || '').localeCompare(b.main || '') || byName(a, b))]);
  list.innerHTML = secs.filter(s => s[1].length).map(s => '<div class="sec"><span>' + E(s[0]) + '</span><span class="muted">' + s[1].length + '</span></div><div class="grid">' + s[1].map(card).join('') + '</div>').join('') ||
    '<div class="empty">' + (all.length ? 'Aucun résultat.' : 'Le roster est vide. Ajoute le premier membre avec « ＋ Nouveau membre ».') + '</div>';
  list.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => memberForm(b.dataset.edit));
}

/* ---------- formulaire membre ---------- */
const mf = {};
function memberForm(key) {
  const m = key ? pub.members.find(x => x.key === key) : null;
  Object.assign(mf, m ? { original: m.key, pseudo: m.pseudo, perso: m.key, classe: m.classe, spe: m.spe, role: m.role, spe2: m.spe2, role2: m.role2, statut: m.statut, type: m.type || 'principal', main: m.main || '', origType: m.type || 'principal', origMain: m.main || '', panel: '', pick: '' }
    : { original: '', pseudo: '', perso: '', classe: '', spe: '', role: '', spe2: '', role2: '', statut: 'Titulaire', type: 'principal', main: '', origType: 'principal', origMain: '', panel: '', pick: '' });
  renderForm();
}
const chipsRole = f => '<div class="roles">' + ['tank', 'soigneur', 'dps'].map(r => '<button class="chip' + (mf[f] === r ? ' on' : '') + '" data-role="' + f + ':' + r + '">' + G.ROLE[r].emoji + ' ' + G.ROLE[r].one + '</button>').join('') + '</div>';
const typeChips = () => '<div class="roles"><button class="chip' + (mf.type !== 'reroll' ? ' on' : '') + '" data-type="principal">⭐ Principal</button><button class="chip' + (mf.type === 'reroll' ? ' on' : '') + '" data-type="reroll">🔁 Reroll</button></div>';
function typeBlock(edit) {
  const kids = edit ? kidsOf(mf.original) : [];
  if (kids.length) return '<label>Type de personnage</label><p class="muted small" style="margin:0 0 4px">⭐ Principal · a ' + kids.length + ' reroll' + (kids.length > 1 ? 's' : '') + ' (' + E(kids.map(k => k.key).join(', ')) + ')</p>';
  const mains = pub.members.filter(x => x.type !== 'reroll' && x.key !== mf.original).sort((a, b) => a.key.localeCompare(b.key));
  return '<label>Type de personnage</label>' + typeChips() +
    '<p class="muted small" style="margin:4px 0 0">' + (mf.type === 'reroll' ? 'Visible seulement dans l\'app, pas dans le roster Discord. Il a ses propres points.' : 'Affiché dans le roster Discord.') + '</p>' +
    (mf.type === 'reroll' ? '<label>Reroll de qui ?</label><select data-sel="main"><option value="">Choisir le personnage principal…</option>' + mains.map(x => '<option' + (x.key === mf.main ? ' selected' : '') + ' value="' + E(x.key) + '">' + E(x.key) + ' (' + E(x.classe) + ')</option>').join('') + '</select>' : '');
}
// Intervertir / Quitte la guilde (fiche d'un membre existant)
function extras() {
  const kids = kidsOf(mf.original), isRe = mf.origType === 'reroll', [pn, pk] = (mf.panel || '|').split('|');
  let html = '<div style="border-top:1px solid var(--line,#2a3a55);margin-top:14px;padding-top:10px"><div class="muted small" style="margin-bottom:6px">Actions sur ce personnage</div><div class="row" style="flex-wrap:wrap">';
  if (isRe) html += '<button class="btn small' + (pn === 'swap' ? ' on' : '') + '" data-panel="swap|' + E(mf.origMain) + '">⇄ Passer principal</button>';
  kids.forEach(k => { html += '<button class="btn small' + (pn === 'swap' && pk === k.key ? ' on' : '') + '" data-panel="swap|' + E(k.key) + '">⇄ Intervertir avec ' + E(k.key) + '</button>'; });
  html += '<button class="btn small' + (pn === 'leave' ? ' on' : '') + '" data-panel="leave|">🚪 Quitte la guilde</button></div>';
  if (pn === 'swap') {
    const a = isRe ? mf.original : pk, b = isRe ? mf.origMain : mf.original;
    html += '<div class="banner" style="margin-top:8px"><b>' + E(a) + '</b> devient le personnage principal (roster Discord) et <b>' + E(b) + '</b> passe reroll. Les points restent sur chaque personnage.</div><button class="btn on" id="x-go" style="width:100%;margin-top:8px">Confirmer l\'inversion</button>';
  } else if (pn === 'leave') {
    let txt = 'Les points de <b>' + E(mf.original) + '</b> sont perdus (dans toutes les saisons) et le personnage est retiré de l\'app.', pick = '';
    if (!isRe && kids.length === 1) txt += ' <b>' + E(kids[0].key) + '</b> devient le personnage principal et garde ses points.';
    if (!isRe && kids.length > 1) {
      if (!mf.pick) mf.pick = kids[0].key;
      txt += ' Un de ses rerolls devient principal et garde ses points :';
      pick = '<select data-pickheir style="margin-top:6px">' + kids.map(k => '<option' + (k.key === mf.pick ? ' selected' : '') + ' value="' + E(k.key) + '">' + E(k.key) + '</option>').join('') + '</select>';
    }
    html += '<div class="banner" style="margin-top:8px">' + txt + pick + '</div><button class="btn on bad" id="x-go" style="width:100%;margin-top:8px">Confirmer le départ</button>';
  }
  return html + '</div>';
}
function renderForm() {
  const edit = !!mf.original, catalog = pub.catalog || {}, specs = catalog[mf.classe] || [];
  const opts = (arr, sel, blank) => '<option value="">' + E(blank) + '</option>' + arr.map(v => '<option' + (v === sel ? ' selected' : '') + '>' + E(v) + '</option>').join('');
  const el = G.modal('<h2 style="margin-top:0">' + (edit ? 'Fiche · ' + E(mf.perso) : 'Nouveau membre') + '</h2>' +
    (edit ? '<p class="muted small" style="margin:0 0 6px">Changement de spé ou de rôle (ex. tank → soigneur) : modifie la spé puis vérifie le rôle. Les points sont conservés.</p>' : '') + '<label>Personnage (en jeu)</label><input data-in="perso" value="' + E(mf.perso) + '"' + (edit ? ' disabled' : '') + ' autocomplete="off">' +
    typeBlock(edit) +
    '<label>Pseudo Discord' + (mf.type === 'reroll' ? ' (vide = celui du principal)' : '') + '</label><input data-in="pseudo" value="' + E(mf.pseudo) + '" autocomplete="off">' +
    '<label>Classe</label><select data-sel="classe">' + opts(Object.keys(catalog), mf.classe, 'Choisir…') + '</select>' +
    '<label>Spé principale</label><select data-sel="spe"' + (mf.classe ? '' : ' disabled') + '>' + opts(specs, mf.spe, 'Choisir…') + '</select>' + (mf.spe ? chipsRole('role') : '') +
    '<label>Spé secondaire (facultatif)</label><select data-sel="spe2"' + (mf.classe ? '' : ' disabled') + '>' + opts(specs, mf.spe2, 'Aucune') + '</select>' + (mf.spe2 ? chipsRole('role2') : '') +
    '<label>Statut</label><select data-sel="statut">' + ['Titulaire', 'Remplaçant', 'Essai'].map(t => '<option' + (t === mf.statut ? ' selected' : '') + '>' + t + '</option>').join('') + '</select>' +
    '<div class="err" id="f-err"></div><div class="row" style="margin-top:8px"><button class="btn grow" id="f-no">Annuler</button><button class="btn on grow" id="f-ok">' + (edit ? 'Enregistrer' : 'Ajouter au roster') + '</button></div>' + (edit ? extras() : ''));
  el.querySelector('#f-no').onclick = G.closeModal;
  el.querySelectorAll('[data-in]').forEach(i => i.oninput = () => { mf[i.dataset.in] = i.value; });
  el.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { mf.type = b.dataset.type; if (mf.type === 'principal') mf.main = ''; renderForm(); });
  el.querySelectorAll('[data-panel]').forEach(b => b.onclick = () => { const [pn, pk] = b.dataset.panel.split('|'); mf.panel = mf.panel === pn + '|' + pk ? '' : pn + '|' + pk; mf.pick = pk || ''; renderForm(); });
  el.querySelectorAll('[data-pickheir]').forEach(s => s.onchange = () => { mf.pick = s.value; });
  const act = el.querySelector('#x-go');
  if (act) act.onclick = async () => {
    act.disabled = true;
    const [pn, pk] = mf.panel.split('|');
    try {
      const r = pn === 'swap'
        ? await G.post('memberSwap', mf.origType === 'reroll' ? { main: mf.origMain, reroll: mf.original } : { main: mf.original, reroll: pk })
        : await G.post('memberLeave', { key: mf.original, heir: mf.pick || '' });
      pub.members = r.members; try { localStorage.removeItem('g:pub'); localStorage.removeItem('g:hist'); } catch (e) {}
      G.closeModal(); chips(); paint();
      G.toast(pn === 'swap' ? 'Principal et reroll intervertis' : mf.original + ' a quitté la guilde');
      if (/^erreur/.test(r.discord)) G.toast('Discord : ' + r.discord, true);
    } catch (e) { el.querySelector('#f-err').textContent = G.errMsg(e); act.disabled = false; }
  };
  el.querySelectorAll('[data-role]').forEach(b => b.onclick = () => { const [f, r] = b.dataset.role.split(':'); mf[f] = r; renderForm(); });
  el.querySelectorAll('[data-sel]').forEach(s => s.onchange = () => {
    const f = s.dataset.sel; mf[f] = s.value;
    if (f === 'classe') { mf.spe = ''; mf.spe2 = ''; mf.role = ''; mf.role2 = ''; }
    if (f === 'spe') mf.role = s.value ? G.suggestRole(mf.classe, s.value) : '';
    if (f === 'spe2') mf.role2 = s.value ? G.suggestRole(mf.classe, s.value) : '';
    renderForm();
  });
  el.querySelector('#f-ok').onclick = async () => {
    const ok = el.querySelector('#f-ok'); ok.disabled = true;
    try {
      const r = await G.post('memberSave', { member: mf });
      pub.members = r.members; try { localStorage.removeItem('g:pub'); } catch (e) {}
      G.closeModal(); chips(); paint();
      G.toast(edit ? 'Fiche enregistrée' : mf.perso + ' ajouté au roster');
      if (/^erreur/.test(r.discord)) G.toast('Roster Discord : ' + r.discord, true);
    } catch (e) { el.querySelector('#f-err').textContent = G.errMsg(e); ok.disabled = false; }
  };
}

/* ---------- externes mémorisés ---------- */
function paintExt(list) {
  document.getElementById('sub').textContent = 'Joueurs externes déjà venus : proposés automatiquement quand tu ajoutes des joueurs à un raid.';
  list.innerHTML = externals.map(x => '<div class="card cc" style="--c:' + G.classColor(x.classe) + '"><div class="row"><div class="grow"><b>' + E(x.name) + '</b> <span class="muted small">' + E(x.classe || '') + '</span>' +
    '<div class="muted small">' + (x.raids ? x.raids + ' raid' + (x.raids > 1 ? 's' : '') + ' · dernier : ' + G.fmtDay(x.last) : 'pas encore compté') + (x.notes ? ' · ' + E(x.notes) : '') + '</div></div>' +
    '<button class="btn small" data-x="' + E(x.name) + '">Modifier</button></div></div>').join('') || '<div class="empty">Aucun externe pour le moment : ils sont enregistrés automatiquement quand tu les ajoutes à un raid.</div>';
  list.querySelectorAll('[data-x]').forEach(b => b.onclick = () => extForm(b.dataset.x));
}
function extForm(name) {
  const x = name ? externals.find(e => e.name === name) : null, st = { name: x ? x.name : '', classe: x ? x.classe : '', notes: x ? x.notes : '', ask: false };
  const render = () => {
    const el = G.modal('<h2 style="margin-top:0">' + (x ? E(st.name) : 'Nouvel externe') + '</h2><label>Nom du personnage</label><input data-i="name" value="' + E(st.name) + '"' + (x ? ' disabled' : '') + '>' +
      '<label>Classe</label><select data-i="classe"><option value="">—</option>' + Object.keys(pub.catalog || {}).map(c => '<option' + (c === st.classe ? ' selected' : '') + '>' + E(c) + '</option>').join('') + '</select>' +
      '<label>Note (facultatif)</label><input data-i="notes" value="' + E(st.notes) + '" placeholder="ex. ami de Sainty, bon tank">' +
      '<div class="err" id="x-err"></div><div class="row" style="margin-top:8px"><button class="btn grow" id="x-no">Annuler</button><button class="btn on grow" id="x-ok">Enregistrer</button></div>' +
      (x ? (st.ask ? '<div class="row" style="margin-top:10px"><span class="grow small muted">Retirer de la liste ? (l\'historique reste)</span><button class="btn small on bad" id="x-del">Confirmer</button></div>' : '<button class="btn small" style="margin-top:10px" id="x-ask">Retirer de la liste</button>') : ''));
    el.querySelectorAll('[data-i]').forEach(i => { i.oninput = i.onchange = () => { st[i.dataset.i] = i.value; }; });
    el.querySelector('#x-no').onclick = G.closeModal;
    const ask = el.querySelector('#x-ask'); if (ask) ask.onclick = () => { st.ask = true; render(); };
    const del = el.querySelector('#x-del');
    if (del) del.onclick = async () => { try { externals = (await G.post('externalForget', { name: st.name })).externals; G.closeModal(); paint(); } catch (e) { G.toast(G.errMsg(e), true); } };
    el.querySelector('#x-ok').onclick = async () => { try { externals = (await G.post('externalSave', { name: st.name, classe: st.classe, notes: st.notes })).externals; G.closeModal(); paint(); } catch (e) { el.querySelector('#x-err').textContent = G.errMsg(e); } };
  };
  render();
}
async function load() {
  try { await G.swr('pub', () => G.get('public'), d => { pub = d; chips(); paint(); }); }
  catch (e) { document.getElementById('list').innerHTML = '<div class="banner">' + E(G.errMsg(e)) + '</div>'; }
}
tabs(); chips(); load();
</script>
</body>
</html>
