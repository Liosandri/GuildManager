<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Événements · Guilde</title>
<link rel="icon" type="image/png" href="assets/favicon.png?v=2">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#050a14">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="nav"></header>
<style>.gcross{color:#46c768;font-weight:900}.when{font-size:17px;line-height:1.35}.when .gold{font-weight:700;margin-left:6px;white-space:nowrap}</style>
<main class="wrap" id="app"></main>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script>
/* ============ Planning ============
   Une soirée = un message Discord avec les boutons Présent / Peut-être / Absent.
   Les joueurs s'inscrivent en se connectant avec Discord ; les inscrits apparaissent ici et dans le message. */
const app = document.getElementById('app');
const E = G.esc;
G.nav('events.html');
let PLANS = [], INST = [], COMPOS = [];

const next = G.nextRaid();
app.innerHTML =
  '<div id="main"><div class="pagehead"><div><h1>⚔️ Événements</h1><p class="muted small">1) Crée la soirée : le message d\'inscription part sur Discord. 2) Compose et valide les rosters : ils partent sur Discord et un événement est créé par roster. 3) Le soir du raid, ouvre le roster pour noter SR, HR et loots. Pour le loot : <a href="https://softres.it/" target="_blank" rel="noopener">softres.it</a> (un raid par roster).</p></div>' +
  '<div class="row"><a class="btn small" href="raid.html" title="Créer un événement sans passer par une soirée, ou consulter les anciens">Événements hors soirée</a><button class="btn small" id="reload">↻ Actualiser</button></div></div>' +
  '<div class="card"><b>Nouvelle soirée</b>' +
  '<div class="row" style="margin-top:10px;flex-wrap:wrap"><input id="pl-title" class="grow" style="min-width:180px" placeholder="Titre (ex. Raid du mercredi)" autocomplete="off"></div>' +
  '<div class="row" style="margin-top:10px;flex-wrap:wrap"><input id="pl-date" type="date" style="width:auto"><input id="pl-time" type="time" style="width:auto">' +
  '<select id="pl-format" style="width:auto"></select>' +
  '<select id="pl-inst" class="grow" style="min-width:150px"></select></div>' +
  '<button class="btn on" id="pl-go" style="width:100%;margin-top:10px">Créer et poster sur Discord</button></div>' +
  '<div class="card" style="margin-top:16px"><div class="row"><b class="grow">⚙️ Typologie des rosters</b><button class="btn small" id="ty-toggle">Modifier</button></div><div id="ty-sum" class="muted small" style="margin-top:6px"></div><div id="ty-edit" hidden></div></div>' +
  '<div class="card" style="margin-top:12px"><div class="row"><b class="grow">🪑 Points de bench</b><select id="bn-season" style="width:auto"></select><button class="btn small" id="bn-toggle">Voir</button></div>' +
  '<p class="muted small" style="margin:6px 0 0">+1 à chaque passage en réserve. Moins de points = banc en premier, dans son rôle. Par saison, jamais remis à zéro.</p><div id="bn-list" hidden></div><div class="row" id="bn-act" hidden style="margin-top:10px;flex-wrap:wrap"><button class="btn small on" id="bn-post">📣 Poster / mettre à jour sur Discord</button><span class="grow"></span><button class="btn small" id="bn-reset">Tout remettre à 0</button></div></div>' +
  '<div id="list"></div></div><div id="compose" hidden></div>';

if (next) {
  document.getElementById('pl-date').value = G.isoDay(next.start);
  document.getElementById('pl-time').value = next.time;
  document.getElementById('pl-title').value = next.name || '';
} else document.getElementById('pl-date').value = G.todayIso();

document.getElementById('reload').onclick = () => load();
document.getElementById('pl-go').onclick = create;

function pills(list) { return list.length ? '<div class="pills">' + list.map(n => '<span class="pill">' + E(n) + '</span>').join('') + '</div>' : '<span class="muted small">—</span>'; }

function tySummary() {
  return COMPOS.map(c => '<b>' + c.format + '</b> : ' + c.tanks + ' tank' + (c.tanks > 1 ? 's' : '') + ', ' + c.heals + ' soigneur' + (c.heals > 1 ? 's' : '') + ', ' + c.dps + ' DPS').join('<br>');
}
function tyRow(c) {
  return '<div class="row ty-row" style="margin-top:8px;flex-wrap:wrap;align-items:center">' +
    '<label class="small muted">Raid de <input type="number" class="ty-f" min="2" max="40" style="width:70px" value="' + c.format + '"></label>' +
    '<label class="small muted">Tanks <input type="number" class="ty-t" min="0" style="width:64px" value="' + c.tanks + '"></label>' +
    '<label class="small muted">Soigneurs <input type="number" class="ty-h" min="0" style="width:64px" value="' + c.heals + '"></label>' +
    '<span class="small ty-d grow"></span><button class="btn small ty-x" title="Retirer" aria-label="Retirer">🗑</button></div>';
}
function tyRefresh() {
  document.querySelectorAll('.ty-row').forEach(r => {
    const f = Number(r.querySelector('.ty-f').value) || 0, t = Number(r.querySelector('.ty-t').value) || 0, h = Number(r.querySelector('.ty-h').value) || 0;
    const d = f - t - h, el = r.querySelector('.ty-d');
    el.textContent = '= ' + d + ' DPS'; el.style.color = d < 0 ? '#ff8a8a' : '';
  });
}
function tyOpen() {
  const box = document.getElementById('ty-edit');
  box.hidden = false; document.getElementById('ty-sum').hidden = true; document.getElementById('ty-toggle').hidden = true;
  box.innerHTML = '<p class="muted small" style="margin:8px 0 0">Un roster est complet quand il atteint la taille du raid avec au moins ce nombre de tanks et de soigneurs. Le reste est du DPS. Tu peux ajouter n\'importe quel format (ex. 25).</p><div id="ty-rows">' + COMPOS.map(tyRow).join('') + '</div>' +
    '<div class="row" style="margin-top:12px"><button class="btn small" id="ty-add">＋ Ajouter un format</button><span class="grow"></span><button class="btn small" id="ty-no">Annuler</button><button class="btn on small" id="ty-ok">Enregistrer</button></div>';
  const wire = () => { box.querySelectorAll('input').forEach(i => i.oninput = tyRefresh); box.querySelectorAll('.ty-x').forEach(b => b.onclick = () => { b.closest('.ty-row').remove(); }); tyRefresh(); };
  wire();
  document.getElementById('ty-add').onclick = () => { document.getElementById('ty-rows').insertAdjacentHTML('beforeend', tyRow({ format: '', tanks: 1, heals: 2 })); wire(); };
  document.getElementById('ty-no').onclick = tyClose;
  document.getElementById('ty-ok').onclick = async () => {
    const rows = [...box.querySelectorAll('.ty-row')].map(r => ({ format: r.querySelector('.ty-f').value, tanks: r.querySelector('.ty-t').value, heals: r.querySelector('.ty-h').value }));
    const btn = document.getElementById('ty-ok'); btn.disabled = true;
    try { const r = await G.post('compoSave', { rows }); COMPOS = r.compos; tyClose(); paint(); G.toast('Typologie enregistrée'); }
    catch (e) { G.toast(G.errMsg(e), true); btn.disabled = false; }
  };
}
function tyClose() {
  document.getElementById('ty-edit').hidden = true; document.getElementById('ty-edit').innerHTML = '';
  document.getElementById('ty-sum').hidden = false; document.getElementById('ty-toggle').hidden = false;
}
document.getElementById('ty-toggle').onclick = tyOpen;

let BENCH = null;
async function loadBench(season) {
  try { BENCH = await G.post('benchList', { season: season || (BENCH && BENCH.season) || '' }); paintBench(); }
  catch (e) { G.toast(G.errMsg(e), true); }
}
function paintBench() {
  if (!BENCH) return;
  const sel = document.getElementById('bn-season');
  sel.innerHTML = BENCH.seasons.map(x => '<option value="' + E(x.id) + '"' + (x.id === BENCH.season ? ' selected' : '') + '>' + E(x.id) + '</option>').join('');
  document.getElementById('bn-list').innerHTML = BENCH.players.length ? BENCH.players.map(p =>
    '<div class="rrow"><span class="grow"><b>' + E(p.pseudo) + '</b> <span class="muted small">' + (RICON[p.role] || '') + '</span></span><b class="gold" style="min-width:30px;text-align:right">' + p.points + '</b>' +
    '<button class="btn small" data-bd="-1" data-bp="' + E(p.pseudo) + '" aria-label="Retirer un point">−</button><button class="btn small" data-bd="1" data-bp="' + E(p.pseudo) + '" aria-label="Ajouter un point">+</button></div>').join('')
    : '<p class="muted small">Aucun joueur.</p>';
  document.querySelectorAll('#bn-list [data-bd]').forEach(b => b.onclick = async () => {
    try { const r = await G.post('benchAdjust', { season: BENCH.season, pseudo: b.dataset.bp, delta: Number(b.dataset.bd) }); BENCH = r; paintBench(); }
    catch (e) { G.toast(G.errMsg(e), true); }
  });
}
document.getElementById('bn-season').onchange = e => loadBench(e.target.value);
async function benchInit(reset) {
  try {
    BENCH = await G.post('benchInit', { season: BENCH && BENCH.season, reset });
    paintBench();
    G.toast(BENCH.discord === 'ok' ? 'Classement à jour sur Discord' : 'Discord : ' + BENCH.discord, BENCH.discord !== 'ok' && BENCH.discord !== 'off');
  } catch (e) { G.toast(G.errMsg(e), true); }
}
document.getElementById('bn-post').onclick = () => benchInit(false);
document.getElementById('bn-reset').onclick = () => {
  const m = G.modal('<h2 style="margin-top:0">Tout remettre à 0 ?</h2><p>Les points de bench de <b>' + E(BENCH ? BENCH.season : '') + '</b> sont effacés pour tous les joueurs (historique de la saison compris), puis le classement est mis à jour sur Discord.</p>' +
    '<div class="row"><button class="btn grow" id="rs-no">Annuler</button><button class="btn on bad grow" id="rs-ok">Remettre à 0</button></div>');
  m.querySelector('#rs-no').onclick = G.closeModal;
  m.querySelector('#rs-ok').onclick = async () => { G.closeModal(); await benchInit(true); };
};
document.getElementById('bn-toggle').onclick = () => {
  const l = document.getElementById('bn-list'), open = l.hidden;
  l.hidden = !open; document.getElementById('bn-act').hidden = !open; document.getElementById('bn-toggle').textContent = open ? 'Masquer' : 'Voir';
  if (open) loadBench();
};

function paint() {
  const fs = document.getElementById('pl-format'), keep = fs.value;
  fs.innerHTML = COMPOS.map(c => '<option value="' + c.format + '">Raid de ' + c.format + '</option>').join('');
  if (COMPOS.some(c => String(c.format) === keep)) fs.value = keep;
  document.getElementById('ty-sum').innerHTML = tySummary();
  document.getElementById('pl-inst').innerHTML = INST.map(i => '<option>' + E(i.name) + '</option>').join('') || '<option value="">Crée d\'abord un raid dans Saisons</option>';
  document.getElementById('list').innerHTML = PLANS.length ? PLANS.map(p =>
    '<div class="card"><div class="when"><b>🗓️ ' + E(p.title) + '</b> <span class="gold">' + E(G.fmtDay(p.date)) + ' - ' + E(p.time) + '</span></div>' +
    '<div class="muted small">Raid de ' + p.format + (p.instance ? ' · ' + E(p.instance) : '') + '</div>' +
    '<div class="gl"><span class="gl-h">✅ Présents <span class="muted">(' + p.present.length + ')</span></span>' + pills(p.present) + '</div>' +
    '<div class="gl"><span class="gl-h">❔ Peut-être <span class="muted">(' + p.maybe.length + ')</span></span>' + pills(p.maybe) + '</div>' +
    '<div class="gl"><span class="gl-h">❌ Absents <span class="muted">(' + p.absent.length + ')</span></span>' + pills(p.absent) + '</div>' +
    (p.events && p.events.length ? '<div class="row" style="margin-top:10px;flex-wrap:wrap"><span class="muted small">Rosters validés :</span>' + p.events.map(ev => '<a class="btn on small" href="raid.html#/' + E(ev.id) + '">🎮 ' + (p.events.length > 1 ? 'Roster ' + ev.n : 'Ouvrir le raid') + (ev.status === 'En cours' ? '' : ' (clos)') + '</a>').join('') + '</div>' : '') +
    '<div class="row" style="margin-top:10px"><button class="btn on small" data-compose="' + E(p.id) + '">🧩 ' + (p.published ? 'Revoir les rosters' : 'Composer les rosters') + '</button><span class="grow"></span><button class="btn small" data-del="' + E(p.id) + '">🗑 Supprimer</button></div></div>').join('')
    : '<p class="muted" style="margin-top:16px">Aucune soirée pour le moment.</p>';
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => del(b.dataset.del));
  document.querySelectorAll('[data-compose]').forEach(b => b.onclick = () => openCompose(b.dataset.compose));
}

async function create() {
  const btn = document.getElementById('pl-go'); btn.disabled = true;
  try {
    const r = await G.post('planCreate', {
      title: document.getElementById('pl-title').value, date: document.getElementById('pl-date').value, time: document.getElementById('pl-time').value,
      format: document.getElementById('pl-format').value, instance: document.getElementById('pl-inst').value,
    });
    PLANS = r.plans; paint(); G.toast('Soirée postée sur Discord');
  } catch (e) { G.toast(G.errMsg(e), true); }
  btn.disabled = false;
}

function del(id) {
  const p = PLANS.find(x => x.id === id);
  const m = G.modal('<h2 style="margin-top:0">Supprimer cette soirée ?</h2><p><b>' + E(p ? p.title : '') + '</b> et ses inscriptions seront supprimées, et le message Discord retiré.</p>' +
    '<div class="row"><button class="btn grow" id="dl-no">Annuler</button><button class="btn on bad grow" id="dl-ok">Supprimer</button></div>');
  m.querySelector('#dl-no').onclick = G.closeModal;
  m.querySelector('#dl-ok').onclick = async () => {
    G.closeModal();
    try { const r = await G.post('planDelete', { id }); PLANS = r.plans; paint(); G.toast('Soirée supprimée'); } catch (e) { G.toast(G.errMsg(e), true); }
  };
}

/* ---------- composer les rosters ---------- */
let CUR = null, V = null, timer = null, sig = '';
const CROSS = '<span class="gcross">✚</span>';
const ICON = { tank: '🛡️', soigneur: CROSS, cac: '⚔️', dist: '🏹' };
const SLOTS = [['tank', ICON.tank, 'Tanks'], ['soigneur', ICON.soigneur, 'Soigneurs'], ['cac', ICON.cac, 'DPS mêlée'], ['dist', ICON.dist, 'DPS distance']];
const RICON = { tank: ICON.tank, soigneur: ICON.soigneur, dps: ICON.cac };
const chip = m => '<span class="pill" style="border-color:' + G.classColor(m.classe) + (m.stale ? ';opacity:.6" title="ILVL non mis à jour depuis plus de 2 semaines' : '') + '">' + E(m.perso) + ' <span class="muted">' + (ICON[m.slot] || '') + ' ' + E(m.spe || m.classe) +
  (m.spe2 && !m.alt ? ' / ' + (ICON[m.slot2] || '') + ' ' + E(m.spe2) : '') + (m.alt ? ' (2e spé)' : '') + (m.ilvl ? ' · ' + E(m.ilvl) : '') + ' · 🪑' + (m.bench || 0) + '</span></span>';

function openCompose(id) {
  CUR = id; sig = '';
  document.getElementById('main').hidden = true;
  const c = document.getElementById('compose'); c.hidden = false;
  c.innerHTML = '<div class="muted">Chargement…</div>';
  refreshView(true);
  clearInterval(timer);
  timer = setInterval(() => { if (document.visibilityState === 'visible') refreshView(false); }, 10000);
}

function closeCompose() {
  clearInterval(timer); CUR = null; V = null;
  document.getElementById('compose').hidden = true; document.getElementById('main').hidden = false; load();
}

async function refreshView(force) {
  if (!CUR) return;
  try { applyView(await G.post('planView', { id: CUR }), force); }
  catch (e) { if (force) document.getElementById('compose').innerHTML = '<div class="banner">' + E(G.errMsg(e)) + '</div>'; }
}

function applyView(v, force) {
  V = v;
  const s = JSON.stringify(v);
  if (!force && s === sig) return;
  if (!force && document.activeElement && (document.activeElement.tagName === 'SELECT' || document.activeElement.tagName === 'INPUT')) return; // ne pas gêner un choix en cours
  sig = s; paintCompose();
}

function targetOptions(cur) {
  let o = '<option value="0"' + (cur === 0 ? ' selected' : '') + '>Réserve</option>';
  for (let i = 1; i <= Math.max(V.maxGroup, 1); i++) o += '<option value="' + i + '"' + (cur === i ? ' selected' : '') + '>Roster ' + i + '</option>';
  return o;
}

function memberRow(m, cur) {
  const alt = m.spe2 ? '<button class="btn small" data-alt="' + E(m.perso) + '" data-to="' + (m.alt ? '0' : '1') + '" title="Change le rôle joué ce soir">↔ ' + (m.alt ? (ICON[m.slotMain] || '') + ' ' + E(m.speMain) : (ICON[m.slot2] || '') + ' ' + E(m.spe2)) + '</button>' : '';
  return '<div class="rrow"><span class="grow">' + chip(m) + '</span>' + alt + '<select data-mv="' + E(m.perso) + '" aria-label="Déplacer ' + E(m.perso) + '">' + targetOptions(cur) + '</select></div>';
}

function paintCompose() {
  const p = V.plan, t = V.typology, r = V.registered;
  const cols = SLOTS.map(([k, ic, name]) => '<div class="gl"><span class="gl-h">' + ic + ' ' + name + ' <span class="muted">(' + r[k].length + ')</span></span><div class="pills">' +
    (r[k].length ? r[k].map(m => m.spe2 ? chip(m) + '<button class="btn small" data-alt="' + E(m.perso) + '" data-to="' + (m.alt ? '0' : '1') + '" title="Jouer ce soir avec l\'autre spé">↔</button>' : chip(m)).join('') : '<span class="muted small">—</span>') + '</div></div>').join('');
  const groups = V.groups.map(g =>
    '<div class="card"><div class="row"><b class="grow">Roster ' + g.n + '</b>' +
    (g.complete ? '<span class="tag">✅ complet</span>' : '<span class="tag" style="color:#ffb4a8">⚠️ ' + E(g.missing.join(' · ')) + '</span>') + '</div>' +
    '<div class="muted small">' + g.tanks + ' tank · ' + g.heals + ' soigneur · ' + g.cac + ' mêlée · ' + g.dist + ' distance' + (g.avg ? ' · ILVL moyen <b>' + g.avg + '</b>' : '') + '</div>' +
    '<div class="row" style="margin-top:8px;flex-wrap:wrap"><input class="grow" style="min-width:200px" data-sr="' + g.n + '" value="' + E(g.sr || '') + '" placeholder="Lien softres.it du raid (facultatif)" autocomplete="off"><button class="btn small" data-srsave="' + g.n + '">🎯 Enregistrer</button></div>' +
    g.members.map(m => memberRow(m, g.n)).join('') + '</div>').join('');
  const aside = '<div class="card"><b>🪑 Réserve</b> <span class="muted small">(' + V.aside.length + ')</span>' +
    (V.aside.length ? V.aside.map(m => memberRow(m, 0)).join('') : '<p class="muted small" style="margin:4px 0 0">Personne.</p>') + '</div>';
  const full = V.groups.filter(g => g.complete).length;
  document.getElementById('compose').innerHTML =
    '<div class="pagehead"><div><h1>🧩 ' + E(p.title) + '</h1><p class="when" style="margin-top:6px"><span class="gold">' + E(G.fmtDay(p.date)) + ' - ' + E(p.time) + '</span></p><p class="muted small">raid de ' + p.format +
    ' — un roster complet = ' + t.tanks + ' tanks, ' + t.heals + ' soigneurs, ' + t.dps + ' DPS</p></div><button class="btn small" id="cp-back">← Retour</button></div>' +
    '<div class="banner" style="margin-bottom:12px">🎯 <b>Avant de valider les rosters :</b> crée un raid de soft-res par roster sur <a href="https://softres.it/" target="_blank" rel="noopener"><b>softres.it</b></a>, puis colle le lien de chaque raid dans la carte du roster correspondant (champ « Lien softres.it »). Il sera ajouté au message Discord.</div>' +
    '<div class="card"><div class="row"><b class="grow">👥 Inscrits « présent » en direct <span class="muted">(' + SLOTS.reduce((n, x) => n + r[x[0]].length, 0) + ')</span></b><span class="muted small">mis à jour toutes les 10 s</span></div>' + cols +
    '<div class="muted small" style="margin-top:10px">❔ Peut-être : ' + (r.maybe.length ? E(r.maybe.map(m => m.perso).join(', ')) : '—') + ' · ❌ Absents : ' + (r.absent.length ? E(r.absent.map(m => m.perso).join(', ')) : '—') + '</div></div>' +
    '<div class="card" style="margin-top:12px"><div class="row" style="flex-wrap:wrap"><span class="grow muted small">' +
    (V.possible ? 'Avec les inscrits actuels, on peut faire <b>' + V.possible + '</b> roster' + (V.possible > 1 ? 's' : '') + ' complet' + (V.possible > 1 ? 's' : '') + '.' : 'Pas assez d\'inscrits pour un roster complet.') +
    '</span><button class="btn on" id="cp-gen">⚙️ ' + (V.groups.length ? 'Régénérer' : 'Générer') + ' les rosters</button></div>' +
    (V.groups.length ? '<p class="muted small" style="margin:8px 0 0">Régénérer remplace tes modifications.</p>' : '') + '</div>' +
    groups + (V.groups.length || V.aside.length ? aside : '') +
    (V.groups.length ? '<button class="btn on" id="cp-pub" style="width:100%;margin-top:14px">✅ Valider et poster sur Discord (' + full + ' roster' + (full > 1 ? 's' : '') + ')</button>' +
      (p.published ? '<p class="muted small" style="text-align:center">Déjà posté : valider à nouveau remplace les messages.</p>' : '') : '') +
    (Object.keys(V.events || {}).length && V.reserve && V.reserve.length ? '<div class="card" style="margin-top:12px"><b>🪑 Réserve de la soirée</b> <span class="muted small">(' + V.reserve.length + ')</span><div class="pills" style="margin-top:6px">' + V.reserve.map(chip).join('') + '</div><p class="muted small" style="margin:8px 0 0">Ils gardent ce statut toute la soirée. Pour remplacer un absent ou leur donner des points de SR : ouvre le raid, bouton « 🪑 Réserve ».</p></div>' : '') +
    (Object.keys(V.events || {}).length ? '<div class="card" style="margin-top:12px"><b>🎮 Rosters validés</b><p class="muted small" style="margin:4px 0 8px">Le soir du raid : ouvre le roster pour noter SR, HR et loots.</p><div class="row" style="flex-wrap:wrap">' +
      Object.keys(V.events).map(n => '<a class="btn on small" href="raid.html#/' + E(V.events[n]) + '">Ouvrir le raid · Roster ' + E(n) + '</a>').join('') + '</div></div>' : '');
  document.getElementById('cp-back').onclick = closeCompose;
  document.getElementById('cp-gen').onclick = generate;
  const pub = document.getElementById('cp-pub'); if (pub) pub.onclick = publish;
  document.querySelectorAll('#compose [data-srsave]').forEach(b => b.onclick = () => saveSr(b.dataset.srsave));
  document.querySelectorAll('#compose [data-alt]').forEach(b => b.onclick = () => setAlt(b.dataset.alt, b.dataset.to === '1'));
  document.querySelectorAll('#compose [data-mv]').forEach(sel => sel.onchange = () => move(sel.dataset.mv, sel.value));
}

async function saveSr(n) {
  const url = document.querySelector('#compose [data-sr="' + n + '"]').value;
  try { applyView(await G.post('planSetSr', { id: CUR, group: Number(n), url }), true); G.toast(url.trim() ? 'Lien enregistré' : 'Lien retiré'); } catch (e) { G.toast(G.errMsg(e), true); }
}

async function generate() {
  if (V.groups.length && !confirm('Régénérer remplace les modifications faites à la main. Continuer ?')) return;
  try { applyView(await G.post('planGenerate', { id: CUR }), true); G.toast('Rosters générés'); } catch (e) { G.toast(G.errMsg(e), true); }
}

async function setAlt(perso, alt) {
  try { applyView(await G.post('planSetAlt', { id: CUR, perso, alt }), true); } catch (e) { G.toast(G.errMsg(e), true); }
}

async function move(perso, group) {
  try { applyView(await G.post('planMove', { id: CUR, perso, group: Number(group) }), true); } catch (e) { G.toast(G.errMsg(e), true); refreshView(true); }
}

function publish() {
  const full = V.groups.filter(g => g.complete), bad = V.groups.filter(g => !g.complete);
  if (!full.length) { G.toast('Aucun roster complet à poster.', true); return; }
  const m = G.modal('<h2 style="margin-top:0">Poster sur Discord ?</h2><p>' + full.length + ' roster' + (full.length > 1 ? 's' : '') + ' complet' + (full.length > 1 ? 's' : '') + ' (' + full.map(g => g.n).join(', ') + ') ' +
    (full.length > 1 ? 'seront postés' : 'sera posté') + ', un message chacun.</p>' +
    (bad.length ? '<p>⚠️ Non postés car incomplets : roster ' + bad.map(g => g.n).join(', ') + '. Leurs joueurs iront en réserve.</p>' : '') +
    (full.some(g => !g.sr) ? '<p>🎯 <b>Pas de lien softres.it</b> pour le roster ' + full.filter(g => !g.sr).map(g => g.n).join(', ') + '. Tu peux poster quand même, mais les joueurs n\'auront pas le lien de réservation.</p>' : '') +
    '<p class="muted small">Un message « Réserve » est aussi posté s\'il reste des joueurs. Chaque joueur en réserve gagne +1 point de bench, et un événement est créé pour chaque roster complet.</p>' +
    '<div class="row"><button class="btn grow" id="pb-no">Annuler</button><button class="btn on grow" id="pb-ok">Poster</button></div>');
  m.querySelector('#pb-no').onclick = G.closeModal;
  m.querySelector('#pb-ok').onclick = async () => {
    m.querySelector('#pb-ok').disabled = true;
    try { const r = await G.post('planPublish', { id: CUR }); G.closeModal(); applyView(r.view, true); G.toast(r.posted.length + ' roster(s) posté(s) sur Discord' + (r.eventsError ? ' · événements : ' + r.eventsError : ''), !!r.eventsError); }
    catch (e) { G.closeModal(); G.toast(G.errMsg(e), true); }
  };
}

async function load() {
  try {
    const [pl, pub, cp] = await Promise.all([G.post('planList'), G.get('public'), G.post('compoList')]);
    PLANS = pl.plans; COMPOS = cp.compos; INST = pub.instances || []; paint();
  } catch (e) { document.getElementById('list').innerHTML = '<div class="banner">' + E(G.errMsg(e)) + '</div>'; }
}
load();
</script>
</body>
</html>
